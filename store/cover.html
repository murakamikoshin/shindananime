<!doctype html><html lang="ja"><meta charset="utf-8">
<style>
html,body{margin:0;width:800px;height:800px;background:#070c17;color:#fff;font-family:"Hiragino Sans","Noto Sans CJK JP","Noto Sans JP",sans-serif;overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(520px 420px at 15% 10%,rgba(125,107,255,.55),transparent 65%),radial-gradient(520px 420px at 95% 90%,rgba(255,92,147,.5),transparent 65%)}

<div class="in">
